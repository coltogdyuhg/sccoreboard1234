<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daktronics System Controller</title>
    <style>
        /* Controller Styling */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #eee; padding: 40px; }
        .dashboard { max-width: 600px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 12px; border: 1px solid #444; }
        .row { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 20px; }
        .control-box { flex: 1; text-align: center; background: #333; padding: 15px; border-radius: 8px; }
        h1 { text-align: center; color: #ffb000; text-transform: uppercase; letter-spacing: 2px; }
        button { 
            width: 100%; padding: 12px; margin: 5px 0; font-weight: bold; cursor: pointer;
            border: none; border-radius: 4px; transition: 0.2s; background: #444; color: white;
        }
        button:hover { background: #555; }
        .btn-plus { background: #28a745; }
        .btn-minus { background: #dc3545; }
        .btn-launch { background: #ffb000; color: #000; font-size: 1.1em; margin-top: 20px; }
        input { width: 80%; padding: 10px; text-align: center; font-size: 1.2em; background: #111; color: #ffb000; border: 1px solid #555; }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>Scoreboard Control</h1>
    
    <button class="btn-launch" onclick="launchScoreboard()">1. Launch Scoreboard Window</button>
    <p style="font-size: 0.8em; text-align: center; color: #888;">(Drag the new window to your 2nd monitor after clicking)</p>
    
    <hr style="border: 0.5px solid #444; margin: 20px 0;">

    <div class="row">
        <div class="control-box">
            <h3>HOME</h3>
            <button class="btn-plus" onclick="changeScore('homeScore', 1)">+1</button>
            <button class="btn-minus" onclick="changeScore('homeScore', -1)">-1</button>
        </div>
        <div class="control-box">
            <h3>GUEST</h3>
            <button class="btn-plus" onclick="changeScore('guestScore', 1)">+1</button>
            <button class="btn-minus" onclick="changeScore('guestScore', -1)">-1</button>
        </div>
    </div>

    <div class="control-box">
        <h3>CLOCK / PERIOD</h3>
        <input type="text" id="clockInput" value="12:00" oninput="updateText('clock', this.value)">
        <div style="margin-top: 10px;">
            <button style="width: 45%;" onclick="changeScore('period', 1)">Next Period</button>
            <button style="width: 45%;" onclick="resetAll()">Reset All</button>
        </div>
    </div>
</div>

<script>
    let scoreboardWin = null;
    let data = { homeScore: 0, guestScore: 0, period: 1, clock: "12:00" };

    function launchScoreboard() {
        // Create the HTML content for the scoreboard window
        const scoreboardHTML = `
            <html>
            <head>
                <title>Daktro-Display</title>
                <style>
                    @font-face {
                        font-family: 'Segment';
                        src: url('https://db.onlinewebfonts.com/t/8e22783d707ad140b4c2acc6603518ee.woff2');
                    }
                    body { 
                        background: #000; color: #ffb000; font-family: 'Segment', monospace; 
                        margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh;
                    }
                    .grid {
                        display: grid; grid-template-columns: 1fr 0.5fr 1fr; width: 95vw; height: 80vh;
                        border: 15px solid #1a1a1a; padding: 20px; background: #050505;
                    }
                    .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; }
                    .label { font-family: Arial, sans-serif; font-weight: bold; font-size: 3vw; color: white; margin-bottom: 10px; }
                    .value { font-size: 18vw; line-height: 1; color: #ff3300; text-shadow: 0 0 20px rgba(255, 51, 0, 0.4); }
                    .clock-cell { grid-column: span 3; border-bottom: 4px solid #222; margin-bottom: 20px; }
                    #clock { color: #ffb000; font-size: 22vw; text-shadow: 0 0 20px rgba(255, 176, 0, 0.4); }
                    #period { color: #00ff00; }
                </style>
            </head>
            <body>
                <div class="grid">
                    <div class="cell clock-cell"><div id="clock">12:00</div></div>
                    <div class="cell"><div class="label">HOME</div><div id="homeScore" class="value">00</div></div>
                    <div class="cell"><div class="label">PERIOD</div><div id="period" class="value">1</div></div>
                    <div class="cell"><div class="label">GUEST</div><div id="guestScore" class="value">00</div></div>
                </div>
            </body>
            </html>
        `;

        // Open a new window
        scoreboardWin = window.open("", "ScoreboardDisplay", "width=1200,height=800");
        scoreboardWin.document.write(scoreboardHTML);
        
        // Initial sync
        setTimeout(() => sync(), 500);
    }

    function changeScore(field, amt) {
        data[field] = Math.max(0, data[field] + amt);
        sync();
    }

    function updateText(field, val) {
        data[field] = val;
        sync();
    }

    function resetAll() {
        data = { homeScore: 0, guestScore: 0, period: 1, clock: "12:00" };
        document.getElementById('clockInput').value = "12:00";
        sync();
    }

    function sync() {
        if (scoreboardWin && !scoreboardWin.closed) {
            scoreboardWin.document.getElementById('homeScore').textContent = data.homeScore.toString().padStart(2, '0');
            scoreboardWin.document.getElementById('guestScore').textContent = data.guestScore.toString().padStart(2, '0');
            scoreboardWin.document.getElementById('period').textContent = data.period;
            scoreboardWin.document.getElementById('clock').textContent = data.clock;
        }
    }
</script>

</body>
</html>
